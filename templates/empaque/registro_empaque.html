<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Empaque - Koppert Biofactory</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex flex-col h-screen font-sans">

    <!-- NAVBAR (Copia y pega el mismo <nav> del dashboard.html aquí) -->
    
    <main class="flex-1 overflow-y-auto p-8">
        <div class="max-w-4xl mx-auto space-y-6">
            
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <h1 class="text-2xl font-black text-slate-800 tracking-tight">Registro de Nuevo Empaque</h1>
                <p class="text-xs text-slate-500 font-medium mt-1">Asignación de Códigos Batch y declaración de stock.</p>
            </div>

            <!-- Formulario principal para Jinja2 -->
            <form method="POST" action="/empaque/guardar" class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Selección de Producto -->
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wide mb-2">Producto a Empacar</label>
                        <select name="id_producto" required class="w-full border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-700 focus:ring-2 focus:ring-emerald-500 bg-slate-50">
                            <option value="" disabled selected>Seleccione material...</option>
                            <option value="1">Catopar (Tubo 500ml)</option>
                            <option value="2">Coleobug (Granel)</option>
                            <option value="3">Huevo Formulación</option>
                        </select>
                    </div>

                    <!-- Lote de Origen -->
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wide mb-2">Lote de Origen (Trazabilidad)</label>
                        <input type="text" name="lote_origen" placeholder="Ej. LOTE-045" required class="w-full border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-700 focus:ring-2 focus:ring-emerald-500 bg-slate-50">
                    </div>

                    <!-- Cantidad Original -->
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wide mb-2">Cantidad (Unidades/Volumen)</label>
                        <input type="number" name="cantidad_original" min="1" step="0.01" required class="w-full border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-700 focus:ring-2 focus:ring-emerald-500 bg-slate-50">
                    </div>

                    <!-- Lógica Venta Directa -->
                    <div class="flex flex-col justify-center bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox" id="checkVentaDirecta" name="venta_directa" class="w-5 h-5 text-emerald-600 border-slate-300 rounded focus:ring-emerald-500">
                            <span class="text-sm font-bold text-slate-700">Es Venta Directa (Sin Stock)</span>
                        </label>
                        <p class="text-[10px] text-slate-500 mt-1 ml-8">No sumará a las existencias del inventario físico.</p>
                    </div>
                </div>

                <!-- Desplegable dinámico para Destino -->
                <div id="divDestino" class="hidden bg-emerald-50 p-6 rounded-xl border border-emerald-100">
                    <label class="block text-xs font-bold text-emerald-800 uppercase tracking-wide mb-2">Sede / Subsidiaria de Destino</label>
                    <select name="sede_destino" id="sede_destino" class="w-full border border-emerald-200 rounded-xl px-4 py-3 text-sm text-emerald-900 focus:ring-2 focus:ring-emerald-500 bg-white">
                        <option value="El Marqués (Local)" selected>El Marqués (Envío Local)</option>
                        <option value="Exportación">Exportación Internacional</option>
                        <option value="Otro">Otra Subsidiaria...</option>
                    </select>
                </div>

                <div class="flex justify-end pt-4 border-t border-slate-100">
                    <button type="submit" class="bg-emerald-950 text-white px-8 py-3 rounded-xl text-sm font-bold hover:bg-emerald-800 transition-all shadow-md">
                        Generar Código Batch y Guardar
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        // Lógica visual para la Venta Directa
        const checkVentaDirecta = document.getElementById('checkVentaDirecta');
        const divDestino = document.getElementById('divDestino');
        const sedeDestino = document.getElementById('sede_destino');

        checkVentaDirecta.addEventListener('change', function() {
            if(this.checked) {
                divDestino.classList.remove('hidden');
                sedeDestino.setAttribute('required', 'true');
            } else {
                divDestino.classList.add('hidden');
                sedeDestino.removeAttribute('required');
            }
        });
    </script>
</body>
</html>
