<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Centro de Control - Koppert Biofactory{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html { scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Ocultar barra de scroll en el menú pero permitir deslizar con el mouse/dedo */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body class="bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-emerald-50/80 via-slate-50 to-slate-100 flex flex-col h-screen font-sans overflow-hidden">

    <!-- Navbar Producción (Diseño Mejorado) -->
    <nav class="bg-gradient-to-r from-emerald-950 to-slate-900 text-emerald-100 shadow-xl shadow-emerald-900/10 z-20 flex-shrink-0 border-b border-emerald-900/50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 gap-2">
                
                <!-- 1. SECCIÓN IZQUIERDA (Recuadro verde más ancho y arriba de Koppert) -->
                <div class="flex items-center shrink-0">
                    <div class="w-10 h-10 bg-gradient-to-br from-emerald-400 to-emerald-600 rounded-xl flex items-center justify-center font-bold text-white mr-3 shadow-lg shadow-emerald-500/30 text-lg">K</div>
                    <div class="flex flex-col justify-center">
                        <!-- Recuadro verde ARRIBA y más ancho -->
                        <span class="text-[9px] bg-emerald-800/80 text-emerald-200 px-3 py-0.5 rounded text-center font-bold uppercase tracking-widest border border-emerald-700/50 mb-0.5 whitespace-nowrap">Panel Producción</span>
                        <!-- Texto KOPPERT ABAJO -->
                        <span class="text-white text-lg font-black tracking-widest leading-none">KOPPERT</span>
                    </div>
                </div>
                
                <!-- 2. SECCIÓN CENTRAL (Con scroll invisible para que quepan todos los botones) -->
                <div class="flex-1 overflow-x-auto hide-scroll flex justify-center mx-2">
                    {% block navbar_menu %}
                    {% endblock %}
                </div>
                
                <!-- 3. SECCIÓN DERECHA ORDENADA (shrink-0 protege contra aplastamiento) -->
                <div class="flex items-center space-x-4 shrink-0">
                    
                    <!-- Botón Panel (whitespace-nowrap evita que el texto se rompa) -->
                    <a href="{{ url_for('admin.dashboard') }}" class="px-3 py-2 rounded-xl text-xs font-bold bg-slate-800/80 text-slate-300 hover:bg-emerald-600 hover:text-white transition-all shadow-sm flex items-center gap-1.5 border border-slate-700/50 group whitespace-nowrap">
                        <svg class="w-4 h-4 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                        Panel
                    </a>

                    <!-- Línea divisoria muy sutil -->
                    <div class="w-px h-6 bg-slate-700/50 hidden sm:block"></div>

                    <!-- Información del Usuario -->
                    <div class="text-right hidden sm:block">
                        <p class="text-xs font-bold text-white whitespace-nowrap"><span class="text-emerald-200 font-medium">{{ session.get('nombre', 'Operador') }}</span></p>
                        <p class="text-[10px] text-emerald-400 font-mono flex items-center justify-end gap-1 mt-0.5 whitespace-nowrap">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            Sesión Segura
                        </p>
                    </div>

                    <!-- Botón Cerrar Sesión -->
                    <a href="{{ url_for('auth.logout') }}" class="text-xs px-4 py-2 text-white font-bold bg-white/10 hover:bg-red-500/80 border border-white/20 hover:border-red-400 rounded-xl transition-all shadow-sm whitespace-nowrap">Cerrar Sesión</a>
                    
                </div>
            </div>
        </div>
    </nav>

    <!-- Área de Trabajo Principal (Mantiene tu diseño original) -->
    <main class="flex-1 overflow-y-auto p-8 relative">
        <div class="max-w-6xl mx-auto space-y-8 relative z-10">
            {% block content %}
            {% endblock %}
        </div>
    </main>
    
    {% block scripts %}
    {% endblock %}
</body>
</html>
