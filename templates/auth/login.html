<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acceso - Koppert</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans antialiased text-slate-800">

    <!-- ==========================================
         FONDO 
         ========================================== -->
    <div class="fixed inset-0 z-0 overflow-hidden">
        <img src="{{ url_for('static', filename='imagenes/logo/fondo2.jpg') }}" alt="Fondo Biofactory" class="w-full h-full object-cover blur-[3px] scale-105">
        <div class="absolute inset-0 bg-slate-900/40"></div>
    </div>
  
    <!-- ==========================================
         CONTENEDOR PRINCIPAL 
         ========================================== -->
    <div class="relative z-10 min-h-screen flex flex-col items-center justify-center px-4">
        
        <!-- TARJETA DE LOGIN (Reducida a max-w-[340px] para que se vea perfectamente proporcional) -->
        <div class="w-full max-w-[340px] bg-white rounded-2xl shadow-2xl border border-slate-100 overflow-hidden">
            
            <div class="p-6 sm:p-8">
                
                <!-- Encabezado -->
                <div class="flex flex-col items-center mb-5">
                    <img src="{{ url_for('static', filename='imagenes/logo/koppert.jpg') }}" alt="Logo Koppert" class="h-24 sm:h-28 w-auto object-contain mb-2">
                    <h2 class="text-[11px] sm:text-xs font-bold text-emerald-800 tracking-[0.25em] uppercase text-center">
                        Biofactory Control
                    </h2>
                    <div class="w-12 h-0.5 bg-emerald-500/40 mt-3 rounded-full"></div>
                </div>

                <!-- Alerta de Seguridad -->
                <div class="flex flex-col items-center mb-6">
                    <div class="w-full max-w-[260px] bg-emerald-50 border border-emerald-200 py-2.5 px-3 rounded-lg flex items-center justify-center gap-2 shadow-sm">
                        <svg class="w-4 h-4 text-emerald-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                        <p class="text-[10px] font-bold text-emerald-800 uppercase tracking-wide">Acceso Controlado</p>
                    </div>
                </div>

                <!-- MENSAJE DE ERROR DINÁMICO -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="mb-5 bg-red-50 border-l-4 border-red-600 text-red-800 px-4 py-3 rounded-lg flex items-center gap-3 shadow-sm text-xs">
                                <svg class="w-4 h-4 text-red-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                <span class="font-bold">{{ message }}</span>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <!-- FORMULARIO -->
                <form action="/auth/login" method="POST" class="space-y-4 flex flex-col items-center">
                    
                    <!-- Input de NIP -->
                    <div class="w-full max-w-[260px]">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5 text-center">NIP de Operador</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            </div>
                            
                            <input type="password" name="nip" required autocomplete="off" inputmode="numeric" pattern="[0-9]*"
                                class="w-full h-[40px] pl-10 pr-10 bg-white border-2 border-slate-200 rounded-lg focus:border-emerald-600 focus:ring-0 outline-none transition-all text-slate-800 text-[14px] tracking-[0.4em] font-black placeholder:text-slate-300 placeholder:tracking-[0.4em] placeholder:font-black text-center shadow-sm"
                                placeholder="••••">
                        </div>
                    </div>

                    <!-- Botón -->
                    <button type="submit" class="w-full max-w-[260px] h-[40px] bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 rounded-lg transition-colors text-[11px] uppercase tracking-widest shadow-sm flex justify-center items-center gap-2">
                        INGRESAR
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>

                </form>

                <!-- Footer Mejorado y Vistoso -->
                <div class="mt-6 pt-5 border-t border-slate-100 flex justify-center">
                    <a href="#" class="group flex items-center gap-1.5 text-slate-500 hover:text-emerald-700 transition-colors">
                        <svg class="w-3.5 h-3.5 text-slate-400 group-hover:text-emerald-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span class="text-[10px] sm:text-[11px] font-medium tracking-wide">
                            ¿Problemas de acceso? <span class="font-bold underline underline-offset-2 decoration-emerald-500/30 group-hover:decoration-emerald-500">Contactar al Administrador</span>
                        </span>
                    </a>
                </div>

            </div>
        </div>
        
    </div>

</body>
</html>
