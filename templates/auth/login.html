<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Koppert Biofactory</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen font-sans">

    <!-- Contenedor Principal Centrado -->
    <div class="w-full max-w-md px-4 py-8">
        
        <!-- Tarjeta de Login -->
        <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
            
            <!-- Encabezado / Logo -->
            <div class="flex flex-col items-center mb-8">
                <div class="w-16 h-16 bg-emerald-600 rounded-xl flex items-center justify-center mb-4 shadow-sm">
                    <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                </div>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">KOPPERT</h1>
                <p class="text-sm text-emerald-600 font-semibold tracking-wide uppercase mt-1">Biofactory Control</p>
            </div>

            <!-- Títulos -->
            <div class="mb-6 text-center">
                <h2 class="text-xl font-bold text-slate-900">Iniciar Sesión</h2>
                <p class="text-slate-500 text-sm mt-1">Ingresa tu NIP para acceder al sistema</p>
            </div>

            <!-- Alerta Seguridad -->
            <div class="bg-red-50 border-l-4 border-red-500 p-4 mb-6 rounded-r-md">
                <p class="text-sm font-bold text-red-700">Acceso Restringido</p>
                <p class="text-xs text-red-600 mt-1">Sistema auditado. Todos los accesos son registrados.</p>
            </div>

            <!-- FORMULARIO CONECTADO A FLASK -->
            <form action="/auth/login" method="POST" class="space-y-5">
                
                <!-- Input de NIP -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5 text-center">NIP de Operador / Admin</label>
                    <input type="password" name="nip" required 
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none transition-colors text-slate-900 text-2xl tracking-widest text-center font-bold"
                        placeholder="••••">
                </div>

                <!-- Botón -->
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg transition-colors text-base mt-2 shadow-sm">
                    Ingresar
                </button>

            </form>

        </div>
        
        <!-- Footer -->
        <div class="mt-8 text-center">
            <p class="text-sm text-slate-500 mb-2">¿Problemas para acceder?</p>
            <a href="#" class="text-emerald-600 hover:text-emerald-700 font-semibold text-sm transition-colors">
                Contactar a Sistemas
            </a>
        </div>

    </div>

</body>
</html>
